<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaveOn">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>SaveOn</title>
<style>
:root{--bg:#000;--panel:#121316;--panel2:#121316;--cell:#1b1c20;--cell2:#25272c;--line:#2a2c31;--line2:#1f2125;--blue:#4a9eff;--blue2:#1f6fe0;--amber:#e0b04a;--red:#ff6b57;--bad:#ff7a66;--ok:#7cc4ff;--green:#34d399;--txt:#f4f5f7;--hi:#fff;--dim:#8d929c;--dim2:#5f646d;--sel:#102338;--track:#25282d;--ov:rgba(0,0,0,.72);--glass:rgba(24,25,29,.84);--ambbg:#1d1708;--redbg:#1f0e0a;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Inter,Arial,sans-serif;--r:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
:root[data-theme="light"]{--bg:#f1f3f6;--panel:#fff;--panel2:#fff;--cell:#eef0f4;--cell2:#e2e6ec;--line:#e1e5ea;--line2:#edf0f3;--blue:#1f74d6;--amber:#9a6a0c;--red:#d4402a;--bad:#c0371f;--ok:#1b68bf;--green:#12945f;--txt:#171c24;--hi:#0a0e14;--dim:#6b7280;--dim2:#98a0ab;--sel:#dbe8f7;--track:#e2e6ec;--ov:rgba(20,28,38,.42);--glass:rgba(255,255,255,.88);--ambbg:#f5ead2;--redbg:#f8e2dc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--f);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px}
.num{font-family:var(--r);font-weight:700;color:var(--hi);letter-spacing:-.01em}
body.priv .num,body.priv .it .v,body.priv .ln b,body.priv .split b,body.priv .rv .num,body.priv .leg b,body.priv .mh small{filter:blur(9px);user-select:none}

/* topo */
#top{position:absolute;top:0;left:0;right:0;z-index:9;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg) 78%,transparent)}
#top .ttlw{flex:1;min-width:0}
#ttl{display:block;font-size:26px;font-weight:800;color:var(--hi);letter-spacing:-.02em;line-height:1.1}
#sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
#sub:empty{display:none}
.ib{width:42px;height:42px;border:0;background:var(--cell);color:var(--txt);display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;flex:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.av{font-weight:700;font-size:15px;color:var(--blue)}

.view{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top));bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px calc(116px + env(safe-area-inset-bottom));display:none}
.view.on{display:block}
.wrap{max-width:560px;margin:0 auto}

/* barra de baixo */
#tabbar{position:absolute;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(430px,calc(100% - 24px));height:68px;border-radius:34px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);display:flex;align-items:center;padding:0 8px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
#tabbar>button{flex:1;min-width:0;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;position:relative}
#tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabbar>button.on{color:var(--blue);font-weight:700}
#tabbar .plus{flex:none;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff!important;margin:0 4px;box-shadow:0 6px 18px rgba(74,158,255,.35)}
#tabbar .plus svg{width:26px;height:26px;stroke-width:2}
#tabbar .bdg{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* blocos */
.sec{margin:28px 4px 12px;font-size:19px;font-weight:700;color:var(--hi);letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec:first-child{margin-top:6px}
.sec small{font-size:13px;font-weight:400;color:var(--dim)}
.sec .lk{font-size:14px;font-weight:600;color:var(--blue);background:none;border:0;padding:6px 0}
.card{background:var(--panel);border-radius:26px;padding:18px;margin-bottom:12px;position:relative}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.meta{font-size:13px;color:var(--dim);line-height:1.5}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .4s}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.ok{color:var(--blue)!important}.warn{color:var(--amber)!important}.bad{color:var(--bad)!important}.dim{color:var(--dim)!important}
.pos{color:var(--green)!important}
.b{min-height:50px;padding:10px 18px;background:var(--cell);border:0;color:var(--hi);border-radius:18px;font-size:15px;font-weight:600}
.b.pri{background:var(--blue);color:#fff}
.b.red{color:var(--bad);background:var(--redbg)}
.b.sm{min-height:38px;padding:6px 16px;font-size:14px;border-radius:14px}
.b.full{width:100%}
.b:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* herói */
.hero{padding:22px 20px 20px;background:linear-gradient(180deg,rgba(74,158,255,.10),transparent 60%),var(--panel)}
:root[data-theme="light"] .hero{background:linear-gradient(180deg,rgba(31,116,214,.08),transparent 60%),var(--panel)}
.hero .v{font-size:54px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.03em;font-weight:800}
.hero .v small{font-size:26px;font-weight:600;color:var(--dim)}
.hero.neg .v{color:var(--bad)}
.hero .split{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:12px;color:var(--dim)}
.hero .split b{display:block;font-family:var(--r);font-size:17px;color:var(--hi);margin-top:2px}

/* atalhos */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;color:var(--txt)}
.tile .ti{position:relative;width:100%;max-width:78px;aspect-ratio:1;border-radius:24px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.tile.pri .ti{background:var(--blue)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.pri svg{stroke:#fff}
.tile small{font-size:12px;color:var(--txt);text-align:center;line-height:1.2}
.tile .tb{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}

.env .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.env .top b{font-size:15px;color:var(--hi)}
.env .num{font-size:24px;display:block;margin-top:10px}
.env .num small{font-size:12px;color:var(--dim);font-weight:500}

.al{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;margin-bottom:10px;font-size:14px;line-height:1.45;background:var(--panel)}
.al:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none;align-self:flex-start;margin-top:5px}
.al.warn{background:var(--ambbg)}.al.warn:before{background:var(--amber)}
.al.bad{background:var(--redbg)}.al.bad:before{background:var(--red)}
.al .acts{margin-left:auto;display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* listas */
.it{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.it:last-child{border-bottom:0}
.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--cell)}
.ic svg{width:21px;height:21px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it .t{flex:1;min-width:0}
.it .t .tp{display:block;font-size:12px;color:var(--dim);margin-bottom:1px}
.it .t b{display:block;font-size:15px;font-weight:600;color:var(--hi);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .t span{font-size:12.5px;color:var(--dim)}
.it .v{font-family:var(--r);font-weight:700;font-size:16px;text-align:right;white-space:nowrap;color:var(--hi)}
.it .v small{display:block;font-family:var(--f);font-weight:400;font-size:11px;color:var(--dim)}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin:20px 6px 8px}
.dayh:first-child{margin-top:4px}
.pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--cell);color:var(--dim);white-space:nowrap}
.pill.ok{background:var(--sel);color:var(--blue)}
.pill.warn{background:var(--ambbg)}.pill.bad{background:var(--redbg)}

/* chips (selecionado = branco, como no C6) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--cell);color:var(--dim);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip.on{background:var(--hi);color:var(--bg);font-weight:700}
.chip.on i{box-shadow:0 0 0 2px var(--bg)}
.fl{margin-left:auto;padding:0}

/* revisar */
.rv{padding:14px 0 16px;border-bottom:1px solid var(--line2)}
.rv:last-child{border-bottom:0}
.rv .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rv .h .num{flex:none;white-space:nowrap}
.rv .h b{font-size:15px;color:var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* faixa de meses */
.ms{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 14px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ms::-webkit-scrollbar{display:none}
.mb{flex:1 0 54px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dim);padding:0}
.mb .bw{height:78px;display:flex;align-items:flex-end}
.mb .bw i{display:block;width:11px;border-radius:7px;background:var(--cell2)}
.mb small{font-size:12px;white-space:nowrap}
.mb.on .bw i{background:var(--blue)}
.mb.on small{color:var(--hi);font-weight:700}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 12px}
.mh b{font-size:20px;color:var(--hi);text-transform:capitalize}
.mh small{font-size:13px;color:var(--dim)}

/* abas do Plano */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:12px 14px 13px;font-size:16px;font-weight:600;color:var(--dim);position:relative}
.tabs button.on{color:var(--hi)}
.tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--hi)}

/* folha */
#sheet{position:absolute;inset:0;z-index:20;background:var(--ov);display:none}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - 30px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;background:var(--panel2);border-radius:30px 30px 0 0;padding:26px 18px calc(26px + env(safe-area-inset-bottom))}
#sheet .box:before{content:"";position:absolute;top:10px;left:calc(50% - 18px);width:36px;height:4px;border-radius:2px;background:var(--cell2)}
#sheet h3{font-size:21px;color:var(--hi);margin-bottom:16px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.inp{width:100%;min-height:50px;border-radius:16px;border:1.5px solid transparent;background:var(--cell);padding:10px 14px;color:var(--hi);outline:none}
.inp:focus{border-color:var(--blue)}
.valor{font-family:var(--r);font-size:42px;font-weight:800;text-align:center;min-height:76px;border:0;background:none;border-bottom:2px solid var(--line);border-radius:0}
.seg{display:flex;background:var(--cell);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;min-height:42px;border-radius:12px;color:var(--dim);font-size:15px;font-weight:600}
.seg button.on{background:var(--hi);color:var(--bg)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.cg button{background:var(--cell);border:1.5px solid transparent;border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--txt);min-height:84px}
.cg button .ic{background:var(--panel2);width:38px;height:38px}
.cg button.on{border-color:var(--blue);background:var(--sel);color:var(--blue);font-weight:700}

/* gráficos */
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:150px;height:150px;flex:none}
.leg{flex:1;min-width:0;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px;padding:5px 0}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-family:var(--r);color:var(--hi)}
svg text{font-family:var(--f)}
.crow{display:block;width:100%;background:none;border:0;text-align:left;padding:9px 0;color:inherit}
.crow .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}

.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:15px;border-bottom:1px solid var(--line2)}
.ln:last-child{border-bottom:0}
.ln b{font-family:var(--r);color:var(--hi);white-space:nowrap}
.ln.tot{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:12px}

/* bloqueio */
#lock{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px calc(30px + env(safe-area-inset-bottom));text-align:center}
#lock.on{display:flex}
#lock .lg{width:84px;height:84px;margin-bottom:18px}
#lock h1{font-size:28px;color:var(--hi);margin-bottom:6px}
#lock p{color:var(--dim);font-size:14px;margin-bottom:22px;line-height:1.5;max-width:320px}
#lock form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
#lock .err{color:var(--bad);font-size:13px;min-height:18px}

.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 26px}
.dots i{width:15px;height:15px;border-radius:50%;background:var(--cell2);transition:.12s}
.dots i.on{background:var(--blue);transform:scale(1.12)}
.dots.err i{background:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center;margin:0 auto}
.pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--cell);color:var(--hi);font-size:28px;font-weight:600;font-family:var(--r)}
.pad button:active{background:var(--cell2)}
.pad span{width:76px;height:76px}
#toast{position:absolute;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--hi);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:28px 10px;color:var(--dim);font-size:14px;line-height:1.5}

@media (min-width:900px){
  .wrap{max-width:1060px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .cols>div>.sec:first-child{margin-top:6px}
  #tabbar{bottom:18px}
  .tabs{margin:0 0 16px;padding:0}
}

@media (max-width:520px){.fl{margin-left:0;flex:1 1 100%}}
</style>
</head>
<body>

<div id="top">
  <button class="ib av" id="av" data-a="config" aria-label="Ajustes">S</button>
  <div class="ttlw"><b id="ttl">Hoje</b><small id="sub"></small></div>
  <button class="ib" data-a="priv" aria-label="Ocultar valores"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="ib" data-a="tema" aria-label="Tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div>

<main id="v-hoje" class="view on"><div class="wrap" id="hoje"></div></main>
<main id="v-extrato" class="view"><div class="wrap" id="extrato"></div></main>
<main id="v-graf" class="view"><div class="wrap" id="graf"></div></main>
<main id="v-plano" class="view"><div class="wrap" id="plano"></div></main>

<nav id="tabbar">
  <button data-a="tab" data-t="hoje" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Hoje</button>
  <button data-a="tab" data-t="extrato"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Extrato<span class="bdg" id="bdg" hidden></span></button>
  <button class="plus" data-a="importar" aria-label="Importar extrato"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
  <button data-a="tab" data-t="graf"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg>Gráficos</button>
  <button data-a="tab" data-t="plano"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plano</button>
</nav>

<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>

<div id="lock">
  <svg class="lg" viewBox="0 0 64 64"><defs><linearGradient id="lgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4e9ff"/><stop offset=".28" stop-color="#4a9eff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgB)"/><path d="M16 42l10-10 7 7 15-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 24h10v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="lockc"></div>
</div>

<input type="file" id="fImp" accept=".ofx,.csv,.txt,.pdf,application/pdf,text/csv" hidden>
<input type="file" id="fBak" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const LS='saveon:v1',LA='saveon:auth',LT='saveon:tema',LP='saveon:pdfpw';
let IMPF='debito';

const hexe=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derivar(email,pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('saveon:'+email),iterations:310000,hash:'SHA-256'},k,512));
  return{auth:hexe(bits.slice(0,32)),key:b64e(bits.slice(32))};
}
const chaveAES=async k=>crypto.subtle.importKey('raw',b64d(k),'AES-GCM',false,['encrypt','decrypt']);
async function cifrar(obj,k){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await chaveAES(k),new TextEncoder().encode(JSON.stringify(obj))));
  const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);
  let bin='';for(let i=0;i<o.length;i+=8192)bin+=String.fromCharCode(...o.subarray(i,i+8192));
  return btoa(bin);
}
async function decifrar(blob,k){
  const o=b64d(blob);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:o.slice(0,12)},await chaveAES(k),o.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function api(rota,met,corpo,tok){

}
function mescla(L,R){
  const del=new Set([...(L.del||[]),...(R.del||[])]);
  const ids=new Set(L.tx.map(t=>t.id));
  const tx=L.tx.concat((R.tx||[]).filter(t=>!ids.has(t.id))).filter(t=>!del.has(t.id));
  const rk=new Set(L.regras.map(r=>r.k+'|'+r.s));
  const regras=L.regras.concat((R.regras||[]).filter(r=>!rk.has(r.k+'|'+r.s)));
  return normS({...R,...L,tx,regras,del:[...del].slice(-3000)});
}

async function empurra(){
  if(!C||C.expirou)return;
  if(sy.busy){agenda();return}
  sy.busy=true;
  try{
    for(let i=0;i<4;i++){
      const v0=VER,blob=await cifrar(S,C.key);
      const r=await api('/dados','PUT',{base:C.rev,blob},C.token);

      if(!r.ok)throw new Error(r.j.erro||'erro '+r.st);
      C.rev=r.j.rev;C.sujo=VER!==v0;C.em=Date.now();saveC();
      status(C.sujo?'salvando…':'');
      if(C.sujo)agenda();
      render();return;
    }
    throw new Error('conflito repetido');
  }catch(e){status('sem conexão · salvo só no aparelho');console.warn(e)}
  finally{sy.busy=false}
}
async function puxa(){
  if(!C||C.expirou||sy.busy)return;
  try{
    const r=await api('/dados','GET',null,C.token);
    if(r.st===401){sessaoCaiu();return}
    if(!r.ok)throw new Error(r.j.erro||'erro');
    if(r.j.rev>C.rev&&r.j.blob){
      const rem=await decifrar(r.j.blob,C.key);
      S=C.sujo?mescla(S,rem):normS(rem);
      C.rev=r.j.rev;saveC();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      render();

    if(C.sujo||r.j.rev===0&&(S.tx.length||S.contas.length||S.rendas.length)){C.sujo=true;saveC();await empurra()}

  }catch(e){status('sem conexão · salvo só no aparelho');console.warn(e)}
}

/* ============ cálculo do mês ============ */
function contasDoMes(m){
  const ov=(S.contaMes&&S.contaMes[m])||{},pm=(S.pagoMan&&S.pagoMan[m])||{};
  const fix=S.contas.filter(c=>!c.pausada||ov[c.id]!=null||pm[c.id]).map(c=>({...c,valor:ov[c.id]!=null?ov[c.id]:c.valor,av:false}));
  const av=S.avulsos.filter(a=>a.mes===m).map(a=>({...a,valor:ov[a.id]!=null?ov[a.id]:a.valor,cat:'contas',dia:0,av:true}));
  return fix.concat(av);
}
function pagoConta(c,m){
  const p=-soma(S.tx.filter(t=>t.v<0&&mesDe(t.d)===m&&(t.conta===c.id||(!t.conta&&c.cat!=='contas'&&t.cat===c.cat))),'v');
  return(S.pagoMan&&S.pagoMan[m]&&S.pagoMan[m][c.id])?Math.max(p,c.valor):p;
}
function calc(m){
  const h=hoje(),mA=mesDe(h)===m,dias=diasNoMes(m);
  const dHoje=mA?+h.slice(8):(m<mesDe(h)?dias+1:1);
  const txs=S.tx.filter(t=>mesDe(t.d)===m);
  const rFix=soma(S.rendas.filter(r=>r.tipo!=='variavel'),'valor');
  const rVar=soma(S.rendas.filter(r=>r.tipo==='variavel'),r=>(S.varMes[m]&&S.varMes[m][r.id]!=null)?S.varMes[m][r.id]:r.valor);
  const renda=rFix+rVar;
  const cs=contasDoMes(m);
  const fixos=soma(cs,'valor');
  const metaG=Math.round(rFix*(S.metas.guardarPct||0)/100);
  let livre=renda-fixos;
  const limM=clamp(livre,0,S.metas.mercado);livre-=limM;
  const limG=clamp(livre,0,metaG);livre-=limG;
  const limV=clamp(livre,0,S.metas.variaveis);livre-=limV;
  const sobra=Math.max(0,livre);
  const falta=Math.max(0,fixos+S.metas.mercado+metaG+S.metas.variaveis-renda);
  const out=txs.filter(t=>t.v<0);
  const gr=t=>(CAT[t.cat]||CAT.outros).g;
  const gM=-soma(out.filter(t=>gr(t)==='mercado'),'v');
  const gV=-soma(out.filter(t=>gr(t)==='var'),'v');
  const gHoje=mA?-soma(out.filter(t=>t.d===h&&(gr(t)==='mercado'||gr(t)==='var')),'v'):0;
  const lim=limM+limV;
  const diasRest=mA?dias-dHoje+1:0;
  const restAntes=Math.max(0,lim-(gM+gV-gHoje));
  const porDia=diasRest?restAntes/diasRest:0;
  const pode=porDia-gHoje;
  const entrou=soma(txs.filter(t=>t.v>0&&t.cat==='entrada'),'v');
  const saiu=-soma(out.filter(t=>gr(t)!=='ignora'),'v');
  const guardado=-soma(out.filter(t=>gr(t)==='guardar'),'v');
  const pend=S.tx.filter(t=>!t.ok).length;
  return{m,mA,dias,dHoje,renda,rFix,rVar,fixos,cs,metaG,limM,limG,limV,lim,sobra,falta,gM,gV,gHoje,diasRest,porDia,pode,entrou,saiu,guardado,pend,txs};
}

function alertas(k){
  const a=[];if(!k.mA)return a;
  const hr=new Date().getHours();
  for(const nm of nomeCandidatos().slice(0,1))a.push(['',`Você mandou e recebeu Pix/TED de <b>${esc(nm.toLowerCase().replace(/(^| )\w/g,x=>x.toUpperCase()))}</b>. É você mesmo? Se for, conto como transferência entre suas contas e não como ganho ou gasto.`,'Sim, é eu','meuNome',nm,'Não','naoNome']);
  if(k.pend)a.push([hr>=18?'warn':'',`Você tem <b>${k.pend}</b> lançamento${k.pend>1?'s':''} para revisar.`,'Revisar','irRevisar']);
  for(const[f,nome]of[['debito','débito'],['cartao','cartão']]){const u=ultImp(f);if(u&&Date.now()-u.em>=6*864e5)a.push(['warn',`Faz <b>${Math.floor((Date.now()-u.em)/864e5)} dias</b> que você não envia o extrato do ${nome}.`,'Enviar','importar'])}
  const env=(nome,g,l)=>{if(l<=0)return;const p=g/l;if(p>=1)a.push(['bad',`${nome} estourou: gastou <b>${brl0(g)}</b> de ${brl0(l)}.`]);else if(p>=.8)a.push(['warn',`${nome} em <b>${Math.round(p*100)}%</b>: restam ${brl0(l-g)} até o fim do mês.`])};
  env('Mercado',k.gM,k.limM);env('Variáveis',k.gV,k.limV);
  const venc=[],logo=[];
  for(const c of k.cs){
    if(!c.dia||c.av)continue;
    if(pagoConta(c,k.m)>=c.valor*.9)continue;
    const d=c.dia-k.dHoje;
    if(d<0)venc.push(c);else if(d<=2)logo.push([c,d]);
  }
  if(venc.length===1)a.push(['bad',`<b>${esc(venc[0].nome)}</b> venceu dia ${venc[0].dia} e não está marcada como paga.`,'Paguei','pagar',venc[0].id]);
  else if(venc.length)a.push(['bad',`<b>${venc.length} contas</b> venceram sem estar marcadas como pagas: ${venc.map(c=>esc(c.nome)).join(', ')}.`,'Ver','irContas']);
  for(const[c,d]of logo)a.push(['warn',`<b>${esc(c.nome)}</b> vence ${d===0?'hoje':d===1?'amanhã':'em 2 dias'} (${brl0(c.valor)}).`,'Paguei','pagar',c.id]);
  return a;
}

function rExtrato(){

  const txs=S.tx.filter(t=>mesDe(t.d)===VM&&flt(t)).sort((a,b)=>b.d.localeCompare(a.d)||(b.ts||0)-(a.ts||0));
  const pend=S.tx.filter(t=>!t.ok).sort((a,b)=>b.d.localeCompare(a.d));
  const entrou=soma(txs.filter(t=>t.v>0&&t.cat==='entrada'),'v');
  const saiu=-soma(txs.filter(t=>t.v<0&&CAT[t.cat]?.g!=='ignora'),'v');
  let h=mesStrip(VM,'e')+`<div class="mh"><b>${nomeMes(VM)}</b><small>${txs.length} lançamento${txs.length===1?'':'s'}</small></div>`;

    h+=pend.slice(0,40).map(t=>{
      const lista=(t.v>0?CATS_ENTRADA:CATS_SAIDA).slice().sort((a,b)=>(b===t.cat)-(a===t.cat));
      const cs=t.cat==='contas'?contasDoMes(mesDe(t.d)):[];
      return`<div class="rv"><div class="h"><b>${esc(t.desc)}</b><span class="num ${t.v>0?'pos':''}" style="font-size:17px">${t.v>0?'+':'−'}${brl(Math.abs(t.v)).replace('−','')}</span></div><div class="meta">${diaLabel(t.d)}${t.src==='import'?(t.fonte==='cartao'?' · fatura do cartão':' · extrato do débito'):''}</div>
      <div class="chips">${lista.map(c=>`<button class="chip ${t.cat===c?'on':''}" data-a="rvCat" data-id="${t.id}" data-c="${c}"><i style="background:${CAT[c].c}"></i>${CAT[c].n}</button>`).join('')}</div>
      ${cs.length?`<div class="chips">${cs.map(c=>`<button class="chip ${t.conta===c.id?'on':''}" data-a="rvConta" data-id="${t.id}" data-c="${c.id}">${esc(c.nome)}</button>`).join('')}</div>`:''}
      <div class="row" style="margin-top:10px"><button class="b sm pri" data-a="rvOk" data-id="${t.id}">Confirmar</button><button class="b sm" data-a="edit" data-id="${t.id}">Editar</button><button class="b sm" data-a="rvSinal" data-id="${t.id}">${t.v>0?'É saída':'É entrada'}</button></div></div>`}).join('');
    h+=`<button class="b pri full" data-a="rvTodos" style="margin-top:14px">Confirmar todos (${pend.length})</button></div>`;
  }
  h+=`<div class="grid g2" style="margin-bottom:14px"><div class="card" style="margin:0;padding:16px 18px"><div class="lbl">Entrou</div><div class="num pos" style="font-size:25px;margin-top:6px">${brl0(entrou)}</div></div><div class="card" style="margin:0;padding:16px 18px"><div class="lbl">Saiu</div><div class="num" style="font-size:25px;margin-top:6px">${brl0(saiu)}</div></div></div>`;
  h+=`<div class="row" style="margin-bottom:6px"><button class="b sm pri" data-a="importar">Importar extrato</button><button class="b sm" data-a="add">Dinheiro vivo</button><div class="chips fl">${[['todos','Todos'],['debito','Débito'],['cartao','Crédito']].map(([f,n])=>`<button class="chip ${EF===f?'on':''}" data-a="ef" data-f="${f}" style="min-height:38px;padding:0 15px">${n}</button>`).join('')}</div></div>`;
  h+=`<div class="card" style="padding:4px 18px;margin-top:12px">${[['debito','Débito'],['cartao','Cartão']].map(([f,n])=>{const u=ultImp(f);return`<div class="it" style="cursor:default"><span class="ic"><svg viewBox="0 0 24 24" style="stroke:${f==='debito'?'var(--blue)':'#a77bff'}"><path d="M5 8h14M5 12h14M5 16h9"/></svg></span><div class="t"><b>Extrato do ${n.toLowerCase()}</b><span>${u?(u.ate?'até '+dm(u.ate)+' · ':'')+'enviado '+relDia(u.em):'ainda não enviado'}</span></div></div>`}).join('')}</div>`;

  }
  $('#extrato').innerHTML=h;centraStrip('e');
}
function donut(dados){
  const tot=soma(dados,'v');if(!tot)return'';
  const r=56,C=2*Math.PI*r;let off=0;
  const segs=dados.map(d=>{const len=d.v/tot*C;const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${d.c}" stroke-width="20" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s}).join('');
  return`<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--track)" stroke-width="20"/>${segs}<text x="75" y="71" text-anchor="middle" font-size="11" fill="var(--dim)">gasto</text><text x="75" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="var(--hi)" style="font-family:var(--r)">${brl0(tot)}</text></svg>`;
}
function barras(vals,{lin,labels,h=150,cor='var(--blue)',corAlta='var(--red)'}={}){
  const W=340,H=h,pl=34,pb=18,pt=8,n=vals.length;
  const mx=Math.max(1,...vals,lin||0)*1.1;
  const bw=(W-pl)/n;const y=v=>pt+(H-pt-pb)*(1-v/mx);
  const tk=[0,mx/2,mx].map(v=>`<text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="9" fill="var(--dim)">${v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v)}</text><line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/>`).join('');
  const bs=vals.map((v,i)=>v>0?`<rect x="${pl+i*bw+bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(1,H-pb-y(v))}" rx="${Math.min(3,bw*.3)}" fill="${lin&&v>lin?corAlta:cor}"/>`:'').join('');
  const lb=(labels||[]).map((l,i)=>l?`<text x="${pl+i*bw+bw/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--dim)">${l}</text>`:'').join('');
  const ln=lin?`<line x1="${pl}" x2="${W}" y1="${y(lin)}" y2="${y(lin)}" stroke="var(--amber)" stroke-dasharray="4 3" stroke-width="1.3"/>`:'';
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${tk}${bs}${ln}${lb}</svg>`;
}
function rGraf(){
  const k=calc(GM);
  const out=k.txs.filter(t=>t.v<0&&!['ignora','guardar'].includes(CAT[t.cat]?.g)&&t.cat!=='contas');
  const porCat={};out.forEach(t=>porCat[t.cat]=(porCat[t.cat]||0)-t.v);
  const dados=Object.entries(porCat).map(([c,v])=>({c:CAT[c]?.c||'#888',n:CAT[c]?.n||c,v,k:c})).sort((a,b)=>b.v-a.v);
  const dias=k.dias,dv=Array(dias).fill(0);
  k.txs.forEach(t=>{const g=CAT[t.cat]?.g;if(t.v<0&&(g==='mercado'||g==='var'))dv[+t.d.slice(8)-1]-=t.v});
  const lbl=dv.map((_,i)=>(i===0||(i+1)%5===0)?String(i+1):'');
  const meses=[];for(let i=5;i>=0;i--)meses.push(addMes(GM,-i));
  const mm=meses.map(m=>-soma(S.tx.filter(t=>t.v<0&&mesDe(t.d)===m&&t.cat==='mercado'),'v'));
  const vv=meses.map(m=>-soma(S.tx.filter(t=>t.v<0&&mesDe(t.d)===m&&CAT[t.cat]?.g==='var'),'v'));
  const cs=k.cs;
  let h=mesStrip(GM,'g')+`<div class="mh"><b>${nomeMes(GM)}</b></div><div class="cols"><div>`;
  h+=`<div class="sec">Para onde foi o dinheiro <small>sem as contas fixas</small></div><div class="card">${dados.length?`<div class="donut">${donut(dados)}<div class="leg">${dados.slice(0,8).map(d=>`<div><i style="background:${d.c}"></i><span>${d.n}</span><b>${brl0(d.v)}</b></div>`).join('')}</div></div>`:`<div class="empty">Sem gastos lançados neste mês.</div>`}</div>`;
  h+=`<div class="sec">Gasto por dia <small>mercado + variáveis</small></div><div class="card">${barras(dv,{lin:k.lim/dias,labels:lbl})}<div class="meta" style="margin-top:6px"><span class="warn">- - -</span> média que cabe por dia (${brl0(k.lim/dias)}). Barra vermelha = dia acima da média.</div></div>`;
  h+=`</div><div>`;
  h+=`<div class="sec">Mercado nos últimos 6 meses</div><div class="card">${barras(mm,{lin:S.metas.mercado,labels:meses.map(m=>MESES[+m.slice(5)-1].slice(0,3))})}<div class="meta" style="margin-top:6px"><span class="warn">- - -</span> meta de ${brl0(S.metas.mercado)}</div></div>`;
  h+=`<div class="sec">Variáveis nos últimos 6 meses</div><div class="card">${barras(vv,{lin:S.metas.variaveis,labels:meses.map(m=>MESES[+m.slice(5)-1].slice(0,3)),cor:'#a77bff'})}<div class="meta" style="margin-top:6px"><span class="warn">- - -</span> meta de ${brl0(S.metas.variaveis)}</div></div>`;
  h+=`<div class="sec">Contas: previsto × pago <small>toque para editar</small></div><div class="card" style="padding:8px 18px">${cs.map(c=>{const pg=pagoConta(c,GM);const p=c.valor?pg/c.valor:0;return`<button class="crow" data-a="fContaMes" data-id="${c.id}" data-m="${GM}"><div class="l"><span>${esc(c.nome)}</span><span class="num" style="font-size:14px">${brl0(pg)} <span class="dim">/ ${brl0(c.valor)}</span></span></div><div class="bar ${p>1.05?'bad':''}" style="margin-top:8px;height:7px"><i style="width:${clamp(p*100,0,100)}%"></i></div></button>`}).join('')||'<div class="empty">Sem contas no plano.</div>'}</div>`;
  h+=`</div></div>`;
  $('#graf').innerHTML=h;centraStrip('g');
}

/* formulários do plano */
function formGen(tit,campos,onSave,onDel){
  sheet(`<h3>${tit}</h3>${campos.map(c=>c.t==='sel'?`<label class="fld"><span>${c.l}</span><select class="inp" id="g_${c.k}">${c.o.map(o=>`<option value="${o[0]}" ${String(o[0])===String(c.v)?'selected':''}>${o[1]}</option>`).join('')}</select></label>`:c.t==='chk'?`<label class="fld row" style="gap:10px"><input type="checkbox" id="g_${c.k}" ${c.v?'checked':''} style="width:22px;height:22px"><span style="margin:0;color:var(--txt);font-size:14px">${c.l}</span></label>`:`<label class="fld"><span>${c.l}</span><input class="inp" id="g_${c.k}" value="${esc(c.v??'')}" ${c.t==='n'?'inputmode="decimal"':c.t==='month'?'type="month"':''} placeholder="${esc(c.p||'')}"></label>`).join('')}
  <button class="b pri full" id="gOk">Salvar</button>${onDel?'<button class="b red full" id="gDel" style="margin-top:10px">Apagar</button>':''}`);
  $('#gOk').onclick=()=>{const o={};for(const c of campos){const el=$('#g_'+c.k);o[c.k]=c.t==='chk'?el.checked:c.t==='n'?parseValor(el.value):el.value.trim()}
    for(const c of campos)if(c.t==='n'&&c.req!==false&&!isFinite(o[c.k])){toast('Confira o campo "'+c.l+'"');return}

const PREF=/^(DEBITO DE CARTAO|SAIDA PIX|ENTRADA PIX|PIX (ENVIADO|RECEBIDO|TRANSF\w*|QR\w*)|PIX|COMPRA (NO )?(DEBITO|CREDITO|CARTAO)|COMPRA|PAGAMENTO( DE)?( BOLETO| CONTA)?|PAGTO|PAG|TRANSFERENCIA (ENVIADA|RECEBIDA)|TRANSF|TED|DOC|DEBITO|CREDITO|DEB AUT\w*|ENVIADO|RECEBIDO|PARA|DE)\b\s*/;
function chave(desc){let s=norm(desc);for(let i=0;i<4;i++){const n=s.replace(PREF,'');if(n===s)break;s=n}return s.split(' ').filter(w=>w.length>1).slice(0,3).join(' ')}
function dicaConta(t){const n=norm(t.desc);for(const[k,v]of Object.entries(CONTA_HINT))if(n.includes(k)&&S.contas.some(c=>c.id===v))return v;return undefined}
const RE_OUT=/(?:PIX ENVIADO PARA|TED ENVIADA PARA|TRANSFERENCIA ENVIADA PARA|ENVIADO PARA|ENVIADA PARA) (.+)$/;
const RE_IN=/(?:PIX RECEBIDO DE|TED RECEBIDA DE|TRANSFERENCIA RECEBIDA DE|RECEBIDO DE|RECEBIDA DE) (.+)$/;
const nome3=x=>x.split(' ').filter(w=>w.length>1||w==='E').slice(0,3).join(' ');
function ehMeuDesc(n){n=' '+n.trim()+' ';return/ PIX | TED | TRANSF| DOC /.test(n)&&(S.meusNomes||[]).some(m=>m&&n.includes(' '+m+' '))}
function nomeCandidatos(){
  const o=new Set(),i=new Set();
  for(const t of S.tx){const n=norm(t.desc);let m;
    if(t.v<0&&(m=n.match(RE_OUT)))o.add(nome3(m[1]));
    else if(t.v>0&&(m=n.match(RE_IN)))i.add(nome3(m[1]))}
  return[...o].filter(x=>i.has(x)&&x.split(' ').length>=2&&!(S.meusNomes||[]).includes(x)&&!(S.naoNomes||[]).includes(x));
}
function reaplicaMeusNomes(){
  let c=0;
  for(const t of S.tx)if(t.cat!=='interna'&&t.src==='import'&&ehMeuDesc(norm(t.desc))){t.cat='interna';delete t.conta;t.ok=true;c++}
  return c;
}
function autoCat(desc,v,fonte){
  const n=' '+norm(desc)+' ',kk=chave(desc);
  const r=S.regras.find(r=>r.k&&(kk===r.k||n.includes(' '+r.k+' '))&&(r.s==null||r.s===(v>0)));
  if(r)return{cat:r.cat,conta:r.conta,firme:true};
  if(ehMeuDesc(n)||/ CONTA INVESTIMENTO | ENTRE CONTAS /.test(n))return{cat:'interna',firme:true};
  if(v>0){const i=/RESGATE|ESTORNO/.test(n)||(fonte==='cartao'&&/PAGAMENTO|PAGTO|CREDITO/.test(n));return{cat:i?'interna':'entrada',firme:i}}
  if(fonte!=='cartao'&&/FATURA| BANCO C /.test(n))return{cat:'interna',conta:S.contas.some(c=>c.id==='cartao')?'cartao':undefined,firme:true};
  for(const[k,c]of REGRAS_BASE)if(n.includes(k))return{cat:c,conta:c==='contas'?dicaConta({desc}):undefined,firme:true};
  return{cat:'outros'};
}

async function lerTexto(f){const buf=await f.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(buf);return t}
function dataBR(s,anoPad){
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(!m)return null;
  let y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(anoPad||new Date().getFullYear());
  const d=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(!m[3]&&!anoPad&&d>hoje())return`${+y-1}${d.slice(4)}`;
  return d;
}
function lerOFX(t){
  const out=[];const re=/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|<\/BANKTRANLIST>)/gi;let m;
  const tag=(b,n)=>{const r=b.match(new RegExp('<'+n+'>([^<\\r\\n]*)','i'));return r?r[1].trim():''};
  while((m=re.exec(t))){const b=m[1];const dt=tag(b,'DTPOSTED');const v=Number(tag(b,'TRNAMT').replace(',','.'));if(!dt||!isFinite(v))continue;
    out.push({d:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,v,desc:(tag(b,'MEMO')||tag(b,'NAME')).replace(/\s+/g,' '),fid:tag(b,'FITID')})}
  return out;
}
function lerCSV(t,fonte){
  const linhas=t.split(/\r?\n/).filter(l=>l.trim());if(!linhas.length)return[];
  const sep=[';','\t',','].map(s=>[s,(linhas[0].match(new RegExp(s==='\t'?'\t':'\\'+s,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const split=l=>{const r=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){r.push(c.trim());c='';continue}c+=ch}r.push(c.trim());return r};
  const rows=linhas.map(split);
  let hi=rows.findIndex(r=>r.some(c=>/data/i.test(c))&&r.some(c=>/valor|entrada|sa[ií]da|cr[eé]dito|d[eé]bito/i.test(c)));
  const out=[];
  if(hi>=0){
    const H=rows[hi].map(norm);
    const iD=H.findIndex(h=>h.startsWith('DATA'));
    const iV=(i=>i>=0?i:H.findIndex(h=>h.includes('VALOR')))(H.findIndex(h=>h.includes('VALOR')&&!h.includes('US')));
    const iE=H.findIndex(h=>/ENTRADA|CREDITO/.test(h)),iS=H.findIndex(h=>/SAIDA|DEBITO/.test(h));
    const iT=H.map((h,i)=>/DESCRI|HISTOR|TITULO|ESTABELEC|LANCAMENTO|DETALHE|PARCELA/.test(h)?i:-1).filter(i=>i>=0&&i!==iD);
    for(const r of rows.slice(hi+1)){
      const d=dataBR(r[iD]||'');if(!d)continue;
      let v=NaN;
      if(iV>=0)v=parseValor(r[iV]);
      if(!isFinite(v)||(iV<0)){const e=parseValor(r[iE]),s=parseValor(r[iS]);v=isFinite(e)&&e?Math.abs(e):isFinite(s)&&s?-Math.abs(s):NaN}
      if(!isFinite(v)||!v)continue;
      const desc=iT.map(i=>r[i]).filter(Boolean).join(' · ')||r.filter((c,i)=>i!==iD&&i!==iV&&!/^-?[\d.,R$ ]+$/.test(c)).join(' ');
      out.push({d,v,desc});
    }
  }else{
    for(const r of rows){const d=dataBR(r.find(c=>/\d{1,2}\/\d{1,2}|\d{4}-\d{2}-\d{2}/.test(c))||'');const vc=r.slice().reverse().find(c=>/^-?\s*(R\$)?\s*-?[\d.]+,\d{2}$/.test(c.trim()));if(!d||!vc)continue;
      out.push({d,v:parseValor(vc),desc:r.filter(c=>!/\d{1,2}\/\d{1,2}/.test(c)&&c!==vc).join(' ')})}
  }
  if(fonte==='cartao')out.forEach(o=>o.v=-o.v);
  return out;
}

async function abrirPDF(buf){
  let pw;try{pw=localStorage.getItem(LP)||undefined}catch(e){}
  let errada=false,lembrar=false,tentou=false;
  for(let i=0;i<5;i++){
    try{
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),password:pw}).promise;
      if(tentou){try{lembrar?localStorage.setItem(LP,pw):localStorage.removeItem(LP)}catch(e){}}
      return pdf;
    }catch(e){
      if(!e||e.name!=='PasswordException')throw e;
      errada=pw!==undefined;
      const r=await pedeSenha(errada);
      if(!r)throw new Error('importação cancelada');
      pw=r.pw;lembrar=r.lembrar;tentou=true;
    }
  }
  throw new Error('senha errada várias vezes');
}
async function lerPDF(f,fonte){
  if(!window.pdfjsLib){await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await abrirPDF(await f.arrayBuffer());
  const linhas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
    const g={};tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(g[y]=g[y]||[]).push(it)});
    Object.keys(g).sort((a,b)=>b-a).forEach(y=>linhas.push(g[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(' ')));
  }
  return lerLinhas(linhas,fonte);
}
function lerLinhas(linhas,fonte){
  const txt=linhas.join('\n');
  const ano=(txt.match(/\b\d{1,2}\/\d{1,2}\/(20\d{2})\b/)||txt.match(/\b(20\d{2})\b/)||[])[1];
  const MES={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
  const out=[];let dAtual=null;
  const reV=/(-|−)?\s*R?\$?\s*(-|−)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/g;
  for(let l of linhas){
    const L=norm(l);
    if(/SALDO|TOTAL DE|EXTRATO|PAGINA|AGENCIA|PERIODO|LIMITE/.test(L)&&!/PIX|COMPRA|PAGAMENTO|TRANSF/.test(L))continue;
    let d=null,tirar=null;
    const md=l.match(/^\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?=\s|$)/)||l.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);
    const mx=l.match(/\b(\d{1,2})\s+(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s+(?:de\s+)?(20\d{2}))?/i);
    if(mx){d=`${mx[3]||ano||new Date().getFullYear()}-${String(MES[mx[2].toUpperCase()]).padStart(2,'0')}-${mx[1].padStart(2,'0')}`;tirar=mx[0]}
    else if(md){d=dataBR(md[1],ano);tirar=md[0]}
    const vals=[...l.matchAll(reV)];
    if(d&&!vals.length){if(l.replace(tirar||'','').trim().length<12)dAtual=d;continue}
    if(!vals.length)continue;
    d=d||dAtual;if(!d)continue;
    const v0=vals[0];let v=parseValor(v0[3]);
    const neg=!!(v0[1]||v0[2]);
    let desc=(tirar?l.replace(tirar,''):l).replace(reV,'').replace(/\s+/g,' ').trim();
    const D=norm(desc);
    if(fonte==='cartao'){v=neg||/PAGAMENTO|ESTORNO|CREDITO/.test(D)?v:-v}
    else if(neg)v=-v;
    else if(/RECEBID|CREDITO|ESTORNO|RESGATE|RENDIMENTO|DEPOSITO|ENTRADA/.test(D))v=v;
    else v=-v;
    if(!desc)desc='Lançamento';
    out.push({d,v,desc});
  }
  return out;
}
function juntar(lin,fonte){
  const sig=t=>t.d+'|'+t.v.toFixed(2)+'|'+norm(t.desc).slice(0,24);
  fonte=fonte||'debito';
  const fids=new Set(S.tx.filter(t=>t.fid).map(t=>t.fid));
  const tem={};S.tx.forEach(t=>{tem[sig(t)]=(tem[sig(t)]||0)+1});
  const vistos={};
  let novos=0,rep=0,merge=0,auto=0,duvida=0,de='9999',ate='0000';
  for(const x of lin){
    if(x.d<de)de=x.d;if(x.d>ate)ate=x.d;
    const sg=sig(x);vistos[sg]=(vistos[sg]||0)+1;
    // mesma linha de um extrato anterior (os de 7 dias se sobrepõem); duas compras iguais no mesmo dia continuam valendo
    if((x.fid&&fids.has(x.fid))||vistos[sg]<=(tem[sg]||0)){rep++;continue}
    const dx=new Date(x.d+'T12:00');
    const man=S.tx.find(t=>t.src==='manual'&&!t.casado&&Math.abs(t.v-x.v)<.01&&Math.abs(new Date(t.d+'T12:00')-dx)<=2.5*864e5);
    if(man){man.casado=true;man.fid=x.fid;man.desc=man.desc||x.desc;man.descBanco=x.desc;merge++;continue}
    const a=autoCat(x.desc,x.v,fonte);
    S.tx.push({id:uid(),d:x.d,v:x.v,desc:x.desc,cat:a.cat,conta:a.conta,fid:x.fid,src:'import',fonte,ok:!!a.firme,ts:Date.now()});
    novos++;a.firme?auto++:duvida++;
  }
  (S.imports=S.imports||[]).push({em:Date.now(),fonte,n:novos,de:lin.length?de:null,ate:lin.length?ate:null});
  S.imports=S.imports.slice(-60);
  return{novos,rep,merge,auto,duvida};
}

  };
  PADFN=press;
  document.querySelector('.pad').onclick=e=>{const b=e.target.closest('button');if(b&&PADFN)PADFN(b.dataset.k)};
  return{reset(erro){v='';PADFN=press;const d=$('#pdots');if(!d)return;if(erro){d.classList.add('err');setTimeout(()=>{d.classList.remove('err');dots()},450)}else dots()}};
}
document.addEventListener('keydown',e=>{if(PADFN&&(/^\d$/.test(e.key)||e.key==='Backspace'))PADFN(e.key)});
function telaPinCriar(modo,primeiro){
  $('#lock').classList.add('on');
  $('#lockc').innerHTML=`<h1>${primeiro?'Repita o código':'Crie seu código'}</h1><p>${primeiro?'Digite o mesmo código mais uma vez.':'6 números para abrir o app sem digitar a senha toda vez.'}</p>${padHTML()}<div class="err" id="perr" style="margin:16px 0 8px;min-height:18px"></div><button type="button" class="b" id="pno">${modo==='oferta'?'Agora não':'Cancelar'}</button>`;
  $('#pno').onclick=()=>{PADFN=null;modo==='oferta'?libera():$('#lock').classList.remove('on')};
  padLiga(async x=>{
    if(!primeiro){telaPinCriar(modo,x);return}
    if(x!==primeiro){$('#perr').textContent='Os códigos não são iguais. Vamos de novo.';setTimeout(()=>telaPinCriar(modo),900);return}
    const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));const a=auth()||{};
    a.pin={salt,hash:await hashSenha(x,salt)};a.pinErros=0;localStorage.setItem(LA,JSON.stringify(a));
    if(modo==='oferta')libera();else $('#lock').classList.remove('on');
    toast('Código criado');
  });
}
function telaPin(){
  $('#lock').classList.add('on');
  $('#lockc').innerHTML=`<h1>SaveOn</h1><p>Digite seu código.</p>${padHTML()}<div class="err" id="perr" style="margin:16px 0 8px;min-height:18px"></div><button type="button" class="b" id="psen">Usar a senha da conta</button>`;
  $('#psen').onclick=()=>{PADFN=null;telaSenhaEntrar()};
  const pad=padLiga(async x=>{
    const a=auth(),h=await hashSenha(x,a.pin.salt);
    if(h===a.pin.hash){a.pinErros=0;localStorage.setItem(LA,JSON.stringify(a));PADFN=null;libera();return}
    a.pinErros=(a.pinErros||0)+1;localStorage.setItem(LA,JSON.stringify(a));
    if(a.pinErros>=5){telaSenhaEntrar('Código errado 5 vezes. Entre com a senha da conta.');return}
    $('#perr').textContent='Código errado ('+a.pinErros+' de 5)';pad.reset(true);
  });
}
function telaEntrar(){const a=auth();if(a&&a.pin&&(a.pinErros||0)<5)telaPin();else telaSenhaEntrar()}
async function telaSenhaEntrar(msg){
  const a=auth();PADFN=null;$('#lock').classList.add('on');
  const bio=a.cred&&await bioDisp();
  $('#lockc').innerHTML=`<h1>SaveOn</h1><p>Digite a senha da sua conta.</p><form id="fe">${bio?'<button type="button" class="b pri" id="bBio">Entrar com Face ID</button>':''}<input class="inp" type="password" id="e1" placeholder="Senha" autocomplete="current-password"><div class="err" id="eerr">${esc(msg||'')}</div><button class="b ${bio?'':'pri'}">Entrar com senha</button>${a.pin?'<button type="button" class="b" id="bpin">Voltar ao código</button>':''}</form>`;
  if(bio)$('#bBio').onclick=()=>bioEntrar().catch(()=>{$('#eerr').textContent='Face ID cancelado. Use a senha.'});
  if(a.pin&&$('#bpin'))$('#bpin').onclick=()=>{a.pinErros=0;localStorage.setItem(LA,JSON.stringify(a));telaPin()};
  $('#fe').onsubmit=async e=>{e.preventDefault();const h=await hashSenha($('#e1').value,a.salt);if(h===a.hash){const b=auth();if(b.pin){b.pinErros=0;localStorage.setItem(LA,JSON.stringify(b))}libera()}else{$('#eerr').textContent='Senha errada';$('#e1').value=''}};
}
let saiu=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)saiu=Date.now();else{if(saiu&&Date.now()-saiu>5*60e3&&auth()?.hash)trava();else{render();if(C&&sessionStorage.getItem('saveon:ok'))puxa()}}});

/* ============ início ============ */
(function(){
  try{if(localStorage.getItem('saveon:priv')==='1')document.body.classList.add('priv')}catch(e){}
  let t=null;try{t=localStorage.getItem(LT)}catch(e){}
  if(t){document.documentElement.dataset.theme=t;if(t==='light')document.querySelector('meta[name=theme-color]').content='#f1f3f6'}
  const a=auth();
  if(!C||C.expirou||!a||!a.hash)telaConta('entrar');
  else if(sessionStorage.getItem('saveon:ok')){render();puxa()}
  else telaEntrar();
  render();
  if('serviceWorker'in navigator&&location.protocol!=='file:'){
    const tinha=!!navigator.serviceWorker.controller;let rec=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(tinha&&!rec&&!$('#sheet').classList.contains('on')){rec=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(()=>{});
  }
})();
